name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write
  contents: write

jobs:
  publish:
    name: test and publish to npm with provenance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm (OIDC trusted publishing support; PINNED)
        # Pinned, not npm@latest: npm 12.0.0's global install ships without the bundled
        # `sigstore` module, so `npm publish --provenance` dies with
        # "Cannot find module 'sigstore'". 11.18.0 is the newest known-good 11.x and still
        # supports OIDC trusted publishing (>= 11.5.1). Bump deliberately, never to a moving tag.
        run: npm install -g npm@11.18.0

      - name: Tag must match package.json version
        # The workflow runs from the TAG's tree, so a tag pushed against a stale package.json
        # would publish the wrong version to npm and still cut a GitHub Release under the tag
        # name. Fail loudly here instead, before anything is published.
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $pkg" >&2
            exit 1
          fi

      - name: Tests
        run: node test/run.js

      - name: Publish to npm with provenance
        run: npm publish --provenance --access public

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          make_latest: true
